<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a33"/>
      <stop offset="0.55" stop-color="#13315c"/>
      <stop offset="1" stop-color="#1d4e89"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fb3ff"/>
      <stop offset="1" stop-color="#7ee0c3"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="1080" cy="40" r="170" fill="#4fb3ff" opacity="0.07"/>
  <circle cx="1150" cy="300" r="120" fill="#7ee0c3" opacity="0.06"/>

  <g class="t">
    <text x="64" y="118" font-size="58" font-weight="700" fill="#ffffff">Вадим Гусейнов</text>
    <text x="66" y="166" font-size="28" font-weight="600" fill="url(#accent)">Python-разработчик · Backend</text>
    <text x="66" y="212" font-size="20" fill="#c9d6ea">FastAPI · Django REST Framework · PostgreSQL · Docker · CI/CD</text>
    <g>
      <rect x="66" y="240" width="330" height="38" rx="19" fill="#7ee0c3" fill-opacity="0.14" stroke="#7ee0c3" stroke-opacity="0.55"/>
      <circle cx="90" cy="259" r="6" fill="#7ee0c3"/>
      <text x="106" y="266" font-size="18" font-weight="600" fill="#d8fff3">Открыт к предложениям · удалённо</text>
    </g>
  </g>

  <g class="mono" transform="translate(760 70)">
    <rect width="380" height="196" rx="12" fill="#06101f" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
    <text x="22" y="62" font-size="16" fill="#7ee0c3">$ <tspan fill="#e6edf3">pytest</tspan></text>
    <text x="22" y="90" font-size="16" fill="#9fb3cc">87 passed <tspan fill="#28c840">✓</tspan></text>
    <text x="22" y="118" font-size="16" fill="#7ee0c3">$ <tspan fill="#e6edf3">docker compose up -d</tspan></text>
    <text x="22" y="146" font-size="16" fill="#9fb3cc">4 services running <tspan fill="#28c840">✓</tspan></text>
    <text x="22" y="174" font-size="16" fill="#7ee0c3">$</text>
    <rect x="38" y="161" width="9" height="16" fill="#e6edf3" class="cursor"/>
  </g>
</svg>
